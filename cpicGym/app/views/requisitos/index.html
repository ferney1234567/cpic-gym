<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Requisitos - CPIC Gym</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2d3748;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        .header-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(66, 153, 225, 0.3);
        }

        .header-icon i {
            font-size: 1.5rem;
            color: white;
        }

        .header-title {
            color: white;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .progress-section {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .progress-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(#48bb78 0deg 360deg, #e2e8f0 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            position: relative;
            box-shadow: 0 8px 20px rgba(72, 187, 120, 0.3);
        }

        .progress-circle::before {
            content: '';
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            position: absolute;
        }

        .progress-text {
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        .progress-label {
            color: #cbd5e0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .tab {
            flex: 1;
            padding: 1.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #718096;
            position: relative;
        }

        .tab.active {
            background: white;
            color: #2d3748;
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
        }

        .tab:hover:not(.active) {
            background: #edf2f7;
            color: #4a5568;
        }

        /* Search and Filters */
        .search-section {
            padding: 2rem;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .search-input:focus {
            outline: none;
            border-color: #4299e1;
            background: white;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .filter-btn {
            padding: 1rem 1.5rem;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: #4a5568;
        }

        .filter-btn:hover {
            border-color: #4299e1;
            color: #4299e1;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.15);
        }

        /* Accordion Sections */
        .accordion-container {
            padding: 2rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .accordion-item {
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .accordion-item:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .accordion-header {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .accordion-header:hover {
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
        }

        .accordion-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            color: #2d3748;
        }

        .accordion-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
        }

        .accordion-icon.administrative {
            background: linear-gradient(135deg, #4299e1, #3182ce);
        }

        .accordion-icon.documentation {
            background: linear-gradient(135deg, #48bb78, #38a169);
        }

        .accordion-icon.financial {
            background: linear-gradient(135deg, #ed8936, #dd6b20);
        }

        .accordion-chevron {
            transition: transform 0.3s ease;
            color: #718096;
        }

        .accordion-item.active .accordion-chevron {
            transform: rotate(180deg);
        }

        .accordion-content {
            background: white;
            padding: 1.5rem;
            display: none;
        }

        .accordion-item.active .accordion-content {
            display: block;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .requirement-item:hover {
            background: #edf2f7;
            transform: translateX(4px);
        }

        .requirement-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }

        .requirement-text {
            flex: 1;
            font-weight: 500;
            color: #2d3748;
        }

        /* Footer Actions */
        .footer-actions {
            padding: 2rem;
            background: #f7fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            border: none;
        }

        .btn-secondary {
            background: white;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            box-shadow: 0 8px 20px rgba(66, 153, 225, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(66, 153, 225, 0.4);
        }

        /* Scrollbar Styling */
        .accordion-container::-webkit-scrollbar {
            width: 8px;
        }

        .accordion-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .accordion-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #cbd5e0, #a0aec0);
            border-radius: 4px;
        }

        .accordion-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #a0aec0, #718096);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .search-container {
                flex-direction: column;
            }

            .tabs {
                flex-direction: column;
            }

            .footer-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <h1 class="header-title">Gestión de Requisitos</h1>
            </div>
            <div class="progress-section">
                <div class="progress-circle">
                    <span class="progress-text">100%</span>
                </div>
                <div class="progress-label">Completado</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active">
                    <i class="fas fa-cogs"></i> Técnicos
                </div>
                <div class="tab">
                    <i class="fas fa-microchip"></i> Tecnológicos
                </div>
                <div class="tab">
                    <i class="fas fa-certificate"></i> Certificaciones
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Buscar requisitos...">
                    </div>
                    <button class="filter-btn">
                        <i class="fas fa-filter"></i>
                        Filtros
                    </button>
                </div>
            </div>

            <!-- Accordion Content -->
            <div class="accordion-container">
                <!-- Administrative Section -->
                <div class="accordion-item active">
                    <div class="accordion-header">
                        <div class="accordion-title">
                            <div class="accordion-icon administrative">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            Administrativos
                        </div>
                        <i class="fas fa-chevron-down accordion-chevron"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Saber un lenguaje de programación</div>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Saber 2 idiomas</div>
                        </div>
                    </div>
                </div>

                <!-- Documentation Section -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <div class="accordion-title">
                            <div class="accordion-icon documentation">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            Documentación
                        </div>
                        <i class="fas fa-chevron-down accordion-chevron"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Documentación técnica actualizada</div>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Manuales de usuario completos</div>
                        </div>
                    </div>
                </div>

                <!-- Financial Section -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <div class="accordion-title">
                            <div class="accordion-icon financial">
                                <i class="fas fa-building"></i>
                            </div>
                            Financieros
                        </div>
                        <i class="fas fa-chevron-down accordion-chevron"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Presupuesto aprobado</div>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="requirement-text">Recursos financieros disponibles</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="footer-actions">
                <button class="btn btn-secondary">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
                <button class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Guardar Cambios
                </button>
            </div>
        </main>
    </div>

    <script>
        // Accordion functionality
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', () => {
                const item = header.parentElement;
                const isActive = item.classList.contains('active');
                
                // Close all accordion items
                document.querySelectorAll('.accordion-item').forEach(accordionItem => {
                    accordionItem.classList.remove('active');
                });
                
                // Open clicked item if it wasn't active
                if (!isActive) {
                    item.classList.add('active');
                }
            });
        });

        // Tab functionality
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        // Search functionality
        document.querySelector('.search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const requirementItems = document.querySelectorAll('.requirement-item');
            
            requirementItems.forEach(item => {
                const text = item.querySelector('.requirement-text').textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Button interactions
        document.querySelector('.btn-primary').addEventListener('click', () => {
            // Add loading state
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;
            
            // Simulate save operation
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Guardado';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });
    </script>
</body>
</html>
