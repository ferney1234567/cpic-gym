<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Requisitos - Versión Moderna</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Color Palette - Modern Professional */
            --primary-blue: #2563eb;
            --dark-blue: #1e40af;
            --light-blue: #dbeafe;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --danger-red: #ef4444;
            --neutral-50: #f8fafc;
            --neutral-100: #f1f5f9;
            --neutral-200: #e2e8f0;
            --neutral-300: #cbd5e1;
            --neutral-400: #94a3b8;
            --neutral-500: #64748b;
            --neutral-600: #475569;
            --neutral-700: #334155;
            --neutral-800: #1e293b;
            --neutral-900: #0f172a;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            /* Transitions */
            --transition-fast: 0.15s ease-out;
            --transition-normal: 0.3s ease-out;
            --transition-slow: 0.5s ease-out;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            font-size: 14px;
            line-height: 1.5;
            color: var(--neutral-700);
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .requirements-panel {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            border: 1px solid var(--neutral-200);
            backdrop-filter: blur(20px);
        }

        /* Header Styles */
        .panel-header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            color: white;
            padding: var(--spacing-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .panel-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .header-icon {
            background: rgba(255, 255, 255, 0.2);
            width: 3rem;
            height: 3rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--spacing-lg);
            position: relative;
            z-index: 1;
        }

        .header-icon i {
            font-size: 1.5rem;
        }

        .panel-title {
            font-size: 1.75rem;
            font-weight: 700;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .progress-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }

        .progress-text {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .progress-label {
            font-size: 0.875rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            background: var(--neutral-50);
            padding: var(--spacing-sm);
            border-bottom: 1px solid var(--neutral-200);
        }

        .tab-btn {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--neutral-600);
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }

        .tab-btn:hover {
            background: var(--neutral-100);
            color: var(--neutral-700);
        }

        .tab-btn.active {
            background: white;
            color: var(--primary-blue);
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }

        /* Search and Filter Bar */
        .search-filter-bar {
            padding: var(--spacing-lg);
            background: white;
            border-bottom: 1px solid var(--neutral-200);
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--neutral-400);
            font-size: 0.875rem;
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 2.5rem;
            border: 1px solid var(--neutral-300);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            background: var(--neutral-50);
            transition: all var(--transition-fast);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: white;
            border: 1px solid var(--neutral-300);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            color: var(--neutral-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            background: var(--neutral-50);
            border-color: var(--neutral-400);
        }

        /* Content Area */
        .content-area {
            padding: var(--spacing-lg);
            background: white;
            max-height: 400px;
            overflow-y: auto;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: var(--neutral-100);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--neutral-300);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb:hover {
            background: var(--neutral-400);
        }

        /* Requirement Sections */
        .requirement-section {
            margin-bottom: var(--spacing-lg);
            border: 1px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-normal);
        }

        .requirement-section:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--neutral-300);
        }

        .section-header {
            display: flex;
            align-items: center;
            padding: var(--spacing-lg);
            background: var(--neutral-50);
            border-bottom: 1px solid var(--neutral-200);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .section-header:hover {
            background: var(--neutral-100);
        }

        .section-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--spacing-lg);
            color: white;
            font-size: 1.125rem;
        }

        .section-title {
            flex: 1;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--neutral-700);
        }

        .expand-btn {
            background: none;
            border: none;
            color: var(--neutral-500);
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .expand-btn:hover {
            background: var(--neutral-200);
            color: var(--neutral-700);
        }

        .expand-btn i {
            transition: transform var(--transition-normal);
        }

        .expand-btn:not(.active) i {
            transform: rotate(-90deg);
        }

        /* Section Content */
        .section-content {
            padding: 0;
            max-height: 500px;
            overflow: hidden;
            transition: all var(--transition-normal);
        }

        .section-content.collapsed {
            max-height: 0;
            padding: 0;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--neutral-100);
            transition: all var(--transition-fast);
        }

        .requirement-item:last-child {
            border-bottom: none;
        }

        .requirement-item:hover {
            background: var(--neutral-50);
        }

        /* Custom Checkbox */
        .checkbox-container {
            margin-right: var(--spacing-lg);
        }

        .checkbox-container input[type="checkbox"] {
            display: none;
        }

        .checkbox-label {
            display: block;
            width: 1.25rem;
            height: 1.25rem;
            background: white;
            border: 2px solid var(--neutral-300);
            border-radius: var(--radius-sm);
            cursor: pointer;
            position: relative;
            transition: all var(--transition-fast);
        }

        .checkbox-label:hover {
            border-color: var(--primary-blue);
        }

        .checkbox-container input[type="checkbox"]:checked + .checkbox-label {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .checkbox-container input[type="checkbox"]:checked + .checkbox-label::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .requirement-text {
            font-size: 0.875rem;
            color: var(--neutral-700);
            font-weight: 500;
        }

        /* Action Buttons */
        .action-buttons {
            padding: var(--spacing-lg);
            background: var(--neutral-50);
            border-top: 1px solid var(--neutral-200);
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
        }

        .btn-secondary, .btn-primary {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .btn-secondary {
            background: white;
            color: var(--neutral-600);
            border: 1px solid var(--neutral-300);
        }

        .btn-secondary:hover {
            background: var(--neutral-50);
            border-color: var(--neutral-400);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }
            
            .panel-header {
                flex-direction: column;
                text-align: center;
                gap: var(--spacing-md);
            }
            
            .header-icon {
                margin-right: 0;
            }
            
            .tab-navigation {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
            
            .search-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn-secondary, .btn-primary {
                justify-content: center;
            }
        }

        /* Loading Animation */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Focus States for Accessibility */
        *:focus {
            outline: 2px solid var(--primary-blue);
            outline-offset: 2px;
        }

        button:focus, input:focus, .tab-btn:focus {
            outline: 2px solid var(--primary-blue);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="requirements-panel">
            <!-- Header -->
            <div class="panel-header">
                <div class="header-icon">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <h1 class="panel-title">Gestión de Requisitos</h1>
                <div class="progress-indicator">
                    <span class="progress-text">100%</span>
                    <span class="progress-label">Completado</span>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="tecnicos">Técnicos</button>
                <button class="tab-btn" data-tab="tecnologicos">Tecnológicos</button>
                <button class="tab-btn" data-tab="certificaciones">Certificaciones</button>
            </div>

            <!-- Search and Filter Bar -->
            <div class="search-filter-bar">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Buscar Requisitos">
                </div>
                <button class="filter-btn">
                    <i class="fas fa-filter"></i>
                    Filtros
                </button>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Administrativos Section -->
                <div class="requirement-section">
                    <div class="section-header">
                        <div class="section-icon">
                            <i class="fas fa-users-cog"></i>
                        </div>
                        <h2 class="section-title">Administrativos</h2>
                        <button class="expand-btn active" onclick="toggleSection(this)">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="section-content">
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req1" checked>
                                <label for="req1" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Saber un lenguaje de programación</span>
                        </div>
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req2" checked>
                                <label for="req2" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Saber 2 idiomas</span>
                        </div>
                    </div>
                </div>

                <!-- Documentación Section -->
                <div class="requirement-section">
                    <div class="section-header">
                        <div class="section-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <h2 class="section-title">Documentación</h2>
                        <button class="expand-btn" onclick="toggleSection(this)">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="section-content collapsed">
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req3">
                                <label for="req3" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Título profesional</span>
                        </div>
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req4">
                                <label for="req4" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Cédula de ciudadanía</span>
                        </div>
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req5">
                                <label for="req5" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Hoja de vida actualizada</span>
                        </div>
                    </div>
                </div>

                <!-- Financieros Section -->
                <div class="requirement-section">
                    <div class="section-header">
                        <div class="section-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <h2 class="section-title">Financieros</h2>
                        <button class="expand-btn" onclick="toggleSection(this)">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="section-content collapsed">
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req6">
                                <label for="req6" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Referencias comerciales</span>
                        </div>
                        <div class="requirement-item">
                            <div class="checkbox-container">
                                <input type="checkbox" id="req7">
                                <label for="req7" class="checkbox-label"></label>
                            </div>
                            <span class="requirement-text">Estado financiero</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-secondary">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
                <button class="btn-primary">
                    <i class="fas fa-save"></i>
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Toggle section function
        function toggleSection(btn) {
            const section = btn.closest('.requirement-section');
            const content = section.querySelector('.section-content');
            const icon = btn.querySelector('i');
            
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                content.classList.add('collapsed');
                icon.style.transform = 'rotate(-90deg)';
            } else {
                btn.classList.add('active');
                content.classList.remove('collapsed');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // Search functionality
        document.querySelector('.search-input').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const sections = document.querySelectorAll('.requirement-section');
            
            sections.forEach(section => {
                const items = section.querySelectorAll('.requirement-item');
                let hasVisibleItems = false;
                
                items.forEach(item => {
                    const text = item.querySelector('.requirement-text').textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        item.style.display = 'flex';
                        hasVisibleItems = true;
                    } else {
                        item.style.display = searchTerm ? 'none' : 'flex';
                    }
                });
                
                // Show/hide entire section based on search results
                if (searchTerm && !hasVisibleItems) {
                    section.style.display = 'none';
                } else {
                    section.style.display = 'block';
                    if (searchTerm && hasVisibleItems) {
                        // Auto-expand sections with matching results
                        const expandBtn = section.querySelector('.expand-btn');
                        const content = section.querySelector('.section-content');
                        expandBtn.classList.add('active');
                        content.classList.remove('collapsed');
                    }
                }
            });
        });

        // Checkbox interaction with visual feedback
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const item = this.closest('.requirement-item');
                if (this.checked) {
                    item.style.backgroundColor = 'rgba(37, 99, 235, 0.05)';
                    setTimeout(() => {
                        item.style.backgroundColor = '';
                    }, 300);
                }
                
                // Update progress indicator (simple example)
                updateProgress();
            });
        });

        // Update progress indicator
        function updateProgress() {
            const totalCheckboxes = document.querySelectorAll('input[type="checkbox"]').length;
            const checkedCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const percentage = Math.round((checkedCheckboxes / totalCheckboxes) * 100);
            
            document.querySelector('.progress-text').textContent = percentage + '%';
        }

        // Initialize progress
        updateProgress();

        // Add subtle animations when elements come into view
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe all requirement sections
        document.querySelectorAll('.requirement-section').forEach(section => {
            section.style.opacity = '0';
            section.style.transform = 'translateY(20px)';
            section.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            observer.observe(section);
        });

        // Trigger animations after page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.querySelectorAll('.requirement-section').forEach(section => {
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                });
            }, 100);
        });
    </script>
</body>
</html>
